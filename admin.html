<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamer's Site - Admin</title>
<style>
body{background:#111;color:white;font-family:Arial;padding:20px}
h1{color:#f33}
input,textarea,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box}
button{background:#e22;color:white;border:0;border-radius:7px;font-weight:bold}
.noticia{background:#252525;padding:12px;margin:12px 0;border-radius:8px}
</style>
</head>
<body>

<h1>GAMER'S SITE</h1>
<h2>Painel administrativo</h2>

<input id="titulo" placeholder="Título da notícia">
<textarea id="texto" placeholder="Escreva sua notícia"></textarea>

<button onclick="publicar()">PUBLICAR NOTÍCIA</button>

<p id="mensagem"></p>
<h2>Notícias salvas</h2>
<div id="lista"></div>

<script>
function publicar(){
 const titulo=document.getElementById("titulo").value.trim();
 const texto=document.getElementById("texto").value.trim();

 if(!titulo || !texto){
  document.getElementById("mensagem").textContent="Preencha os dois campos!";
  return;
 }

 let noticias=JSON.parse(localStorage.getItem("noticias") || "[]");
 noticias.unshift({titulo,texto});
 localStorage.setItem("noticias",JSON.stringify(noticias));

 document.getElementById("titulo").value="";
 document.getElementById("texto").value="";
 document.getElementById("mensagem").textContent="Notícia salva com sucesso!";
 mostrar();
}

function mostrar(){
 let noticias=JSON.parse(localStorage.getItem("noticias") || "[]");
 let lista=document.getElementById("lista");
 lista.replaceChildren();

 noticias.forEach(n=>{
  let item=document.createElement("div");
  item.className="noticia";
  let titulo=document.createElement("h3");
  titulo.textContent=n.titulo;
  let texto=document.createElement("p");
  texto.textContent=n.texto;
  item.append(titulo,texto);
  lista.append(item);
 });
}
mostrar();
</script>

</body>
</html>
